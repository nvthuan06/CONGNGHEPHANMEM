name: CD - Deploy to Render (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-render-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tests on main before deployment
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --legacy-peer-deps
      - name: Unit test
        working-directory: backend
        run: npm test
      - name: Build backend
        working-directory: backend
        run: npm run build
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check frontend ESLint
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
        run: npm run build

  deploy:
    name: Trigger Render deploy hooks
    runs-on: ubuntu-latest
    needs: verify
    environment: production
    steps:
      - name: Verify Render deploy hooks are configured
        env:
          RENDER_BACKEND_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
          RENDER_FRONTEND_DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_BACKEND_DEPLOY_HOOK" ] || [ -z "$RENDER_FRONTEND_DEPLOY_HOOK" ]; then
            echo '::error::Missing RENDER_BACKEND_DEPLOY_HOOK or RENDER_FRONTEND_DEPLOY_HOOK GitHub Actions secret.'
            exit 1
          fi
      - name: Trigger Render API deployment
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error --retry 3 --request POST "$DEPLOY_HOOK" >/dev/null
      - name: Trigger Render frontend deployment
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error --retry 3 --request POST "$DEPLOY_HOOK" >/dev/null
      - name: Deployment status
        run: echo 'Render deploy hooks triggered. Check service logs/status on Render; a successful hook does not confirm service health.'
